# Обновления приезжают сами, иначе их не приезжает вовсе.
version: 2

updates:
  # Зависимости сервера. Каталог — корень: репозиторий и есть сервер.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Одной пачкой на всё мелкое: отдельный PR на каждую патч-версию превращает очередь
    # в шум, который перестают читать — а вместе с ним перестают читать и важное. Мажорные
    # остаются порознь: их всё равно читают по одному.
    #
    # Пачка держится на `patterns`, а не только на `update-types`: прежняя запись, где были
    # одни `update-types`, не собрала ничего — #117, #120 и #121, ровно minor и patch,
    # приехали каждый своим PR. «Все зависимости» — умолчание, но написанное умолчание тут
    # единственное, что работает; у `github-actions` группа с ним и написана.
    #
    # Имя группы латиницей: оно попадает в имя ветки, а ветки здесь ASCII.
    groups:
      routine-gradle-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "Зависимости:"

  # Сами actions: их не обновляет никто, а они тоже чужой код в нашей сборке.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "Действия CI:"
