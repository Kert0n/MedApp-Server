name: MedAppServer tests

on:
  pull_request:
    paths:
      - 'src/MedAppServer/**'
      - '.github/workflows/server-tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/MedAppServer/**'
      - '.github/workflows/server-tests.yml'

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MedAppServer

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Создать ключи подписи JWT
        run: sh src/main/resources/certs/gen.sh

      - name: Тесты
        run: ./gradlew test --no-daemon

      - name: Отчёт тестов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            src/MedAppServer/build/reports/tests/test
            src/MedAppServer/build/test-results/test
          retention-days: 7

  query-plan-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MedAppServer

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Создать ключи подписи JWT
        run: sh src/main/resources/certs/gen.sh

      - name: Планы запросов
        run: ./gradlew queryPlanTest --no-daemon

      - name: Отчёт планов запросов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: query-plan-test-results
          path: |
            src/MedAppServer/build/reports/tests/queryPlanTest
            src/MedAppServer/build/test-results/queryPlanTest
            src/MedAppServer/build/reports/query-plans
          retention-days: 7
