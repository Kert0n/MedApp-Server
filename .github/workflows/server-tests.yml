name: MedAppServer tests

# Минимум: тесты на каждый PR и на push в main. Линтеров и сканеров здесь пока нет
# сознательно — сначала пусть будет то, что просто работает.
on:
  pull_request:
    paths:
      - 'src/MedAppServer/**'
      - '.github/workflows/server-tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/MedAppServer/**'
      - '.github/workflows/server-tests.yml'

# Новый push в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MedAppServer

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Ключи подписи не в репозитории. Тот же скрипт, что вызывает сборка образа: он
      # идемпотентен, поэтому просто создаёт пару там, где её нет.
      - name: Создать ключи подписи JWT
        run: sh src/main/resources/certs/gen.sh

      # Тесты используют Testcontainers (VidalDrugFuzzySearchTest), Docker на
      # ubuntu-latest доступен из коробки.
      - name: Тесты
        run: ./gradlew test --no-daemon

      # Отдельным шагом: фикстур на сорок тысяч строк поднимается около минуты, и в обычный
      # прогон это класть незачем. Падение здесь — повод посмотреть план, а не признак
      # сломанного кода: планировщик зависит от статистики.
      - name: Планы запросов
        run: ./gradlew queryPlanTest --no-daemon

      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            src/MedAppServer/build/reports/tests/test
            src/MedAppServer/build/test-results/test
            src/MedAppServer/build/reports/tests/queryPlanTest
            src/MedAppServer/build/test-results/queryPlanTest
            src/MedAppServer/build/reports/queryPlans
            src/MedAppServer/build/reports/queryCounts
          retention-days: 7
