name: Тесты

# Минимум: тесты на каждый PR и на push в main. Фильтров путей больше нет: репозиторий и есть
# сервер, менять в нём что-то мимо сервера негде.
on:
  pull_request:
  push:
    branches: [ main ]

# Токену дозволено только читать код: тестам больше ничего не нужно, а умолчание
# репозитория может оказаться шире.
permissions:
  contents: read

# Новый push в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Та же версия, что объявлена toolchain проекта и стоит в Dockerfile. До этого здесь
      # стояла 21, и сборка проходила лишь потому, что Gradle находил на раннере другую JDK
      # сам: зелёный прогон держался на свойстве образа, а не на нашем решении.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Ключи подписи не в репозитории. Тот же скрипт, что вызывает сборка образа: он
      # идемпотентен, поэтому просто создаёт пару там, где её нет.
      - name: Создать ключи подписи JWT
        run: sh src/main/resources/certs/gen.sh

      # Тесты используют Testcontainers (VidalDrugFuzzySearchTest), Docker на
      # ubuntu-latest доступен из коробки.
      - name: Тесты
        run: ./gradlew test --no-daemon

      # Отдельным шагом: фикстур на сорок тысяч строк поднимается около минуты, и в обычный
      # прогон это класть незачем. Падение здесь — повод посмотреть план, а не признак
      # сломанного кода: планировщик зависит от статистики.
      - name: Планы запросов
        run: ./gradlew queryPlanTest --no-daemon

      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
            build/reports/tests/queryPlanTest
            build/test-results/queryPlanTest
            build/reports/queryPlans
            build/reports/queryCounts
          retention-days: 7
