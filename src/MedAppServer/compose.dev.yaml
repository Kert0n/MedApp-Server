name: medapp-dev

services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: medapp-server-db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d medapp-server-db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
