# Базовые значения, общие для всех профилей.
#
# Здесь только то, что не является секретом. Смысл файла: приложение должно стартовать на
# чистом клоне, где application-prod.properties отсутствует (он не в git). Раньше без этого
# файла не было ни datasource, ни medkit.share.termInMinutes, ни остального — образ просто
# не поднимался, а сообщение об ошибке указывало на первый нерешённый placeholder, а не на
# причину.
#
# Секреты не имеют осмысленных значений по умолчанию и берутся из переменных окружения:
# Spring сопоставляет REGISTRATION_SECRET с registration.secret, POSTGRES_PASSWORD с
# spring.datasource.password и так далее.

spring.application.name=MedAppServer
spring.profiles.default=prod

# Пути к ключам подписи, не содержимое. Пара создаётся сборкой образа через
# src/main/resources/certs/gen.sh; на хосте тот же скрипт запускается один раз вручную.
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem

# registration.secret здесь намеренно не объявлен: значение приходит извне — переменной
# REGISTRATION_SECRET, файлом секрета через configtree (см. compose.yaml) или профилем.
# Значение по умолчанию задано прямо в @Value у AuthController, и если ничего не пришло,
# приложение падает при старте. Пустой барьер — не конфигурация, а обходимая защита.

# Наружу ни текста исключений, ни отклонённых значений. Профиль dev это ослабляет;
# ApiExceptionHandler закрывает то, что обрабатывает сам, а эти два свойства — остальное,
# что уходит в стандартный обработчик ошибок.
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# Значения по умолчанию совпадают с продовыми: короткий токен, короткий share-ключ,
# сдержанные лимиты. Профиль dev ослабляет их для удобства локальной работы.
authentication.termInMinutes=10
authentication.throttle.maxAttempts=20
authentication.throttle.windowInSeconds=300
medkit.share.termInMinutes=15
registration.timeout.InSeconds=300
registration.timeout.BanNumber=3

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
