# Полная продовая конфигурация. Всё, что не является секретом, живёт здесь и лежит в git.
#
# Профиль prod ничего не повторяет: он активируется вторым
# (SPRING_PROFILES_ACTIVE=mock-prod,prod) и доописывает только скрытые значения — реальный
# registration.secret и пароль БД. Поэтому mock-prod и есть прод: изменение поведения
# правится здесь и автоматически действует в проде.
#
# Сам по себе профиль запускается как стенд:
#   docker compose -f compose.mock-prod.yaml up -d --build
# Секреты ниже заведомо ненастоящие, именно поэтому файл можно держать в git.

spring.application.name=MedAppServer

# Пути к ключам подписи, не содержимое. Пара создаётся сборкой образа через
# src/main/resources/certs/gen.sh.
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem

# --- заглушки; в проде перекрываются профилем prod или docker secrets ---
registration.secret=mock-prod-secret
spring.datasource.password=mock-prod-password

# --- база ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medapp-server-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:medapp}
# Схему создаёт db/schema.sql при инициализации Postgres; Hibernate её только проверяет.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- сроки и лимиты ---
authentication.termInMinutes=10
authentication.throttle.maxAttempts=20
authentication.throttle.windowInSeconds=300
medkit.share.termInMinutes=15
registration.timeout.InSeconds=300
registration.timeout.BanNumber=3

# --- периметр ---
# За обратным прокси request.remoteAddr — адрес контейнера прокси, поэтому без native лимит
# регистраций превращается в один общий счётчик на всех клиентов. native ставит Tomcat
# RemoteIpValve, который принимает X-Forwarded-For только от peer'ов из приватных диапазонов;
# framework нельзя, он доверяет заголовку от кого угодно. Верно лишь пока порт приложения не
# публикуется наружу — это обеспечивают сети в compose.yaml.
server.forward-headers-strategy=native
server.port=${SERVER_PORT:8080}

# Наружу ни текста исключений, ни отклонённых значений: сообщения содержат идентификаторы и
# количества. Формат ответа задаёт ApiExceptionHandler.
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# API-документация наружу не отдаётся. На стенде включается переменными:
# SPRINGDOC_API_DOCS_ENABLED=true SPRINGDOC_SWAGGER_UI_ENABLED=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.devtools.add-properties=false

# --- логи ---
# Только в консоль. Значения bind-параметров не логируются: это названия препаратов и
# количества.
logging.level.root=INFO
logging.level.org.kert0n.medappserver=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
