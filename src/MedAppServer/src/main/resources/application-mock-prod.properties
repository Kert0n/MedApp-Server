# Прод-подобный профиль для локальной проверки: те же настройки, что в проде, но с
# заведомо ненастоящими секретами, поэтому файл спокойно лежит в git.
#
# Зачем: проверить продовый путь (ddl-auto=validate, закрытые ошибки, реальный Postgres)
# не имея под рукой продовых секретов и не поднимая Caddy с настоящим доменом.
#
# Запуск: docker compose -f compose.mock-prod.yaml up -d --build

registration.secret=mock-prod-secret

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medapp-server-db}
spring.datasource.username=medapp
spring.datasource.password=medapp

# Как в проде: схема должна совпадать с сущностями, Hibernate её не правит.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Как в проде: наружу ни текста исключений, ни отклонённых значений.
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# В отличие от прода Swagger оставлен включённым — профиль существует ровно для того,
# чтобы по стенду можно было постучать руками.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.root=INFO
logging.level.org.kert0n.medappserver=DEBUG
logging.level.org.hibernate.SQL=INFO
