spring.application.name=MedAppServer
rsa.private-key=${RSA_PRIVATE_KEY:file:./.local/secrets/jwt-private.pem}
rsa.public-key=${RSA_PUBLIC_KEY:file:./.local/secrets/jwt-public.pem}
registration.secret=123
authentication.term=365d
authentication.issuer=medapp-server-dev
authentication.audience=medapp-api
registration.throttle.window=10h
registration.throttle.max-successful-registrations=10
medkit.share.termInMinutes=525600
spring.jpa.open-in-view=false
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
# Detailed local diagnostics. Production keeps SQL and bind values disabled.
logging.level.root=INFO
logging.level.org.kert0n.medappserver=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
spring.datasource.url=jdbc:postgresql://localhost:5432/medapp-server-db
spring.datasource.username=myuser
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
