spring.application.name=MedAppServer
# Created by src/main/resources/certs/gen.sh, which the image build runs on its own.
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem
registration.secret=123
authentication.termInMinutes=525600
registration.timeout.InSeconds=36000
registration.timeout.BanNumber=10
medkit.share.termInMinutes=525600
spring.jpa.open-in-view=false
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
# Logging Configuration (console-only for privacy-by-design)
logging.level.root=INFO
logging.level.org.kert0n.medappserver=DEBUG
# DEBUG, а не INFO: на INFO отказ фильтра не пишет ни строки, и 401 выглядит как молчание
# сервера — по логу невозможно отличить «нет доступа» от «эндпоинт не отвечает». Только dev:
# на этом уровне в лог попадают заголовки запросов.
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
# Bind values, i.e. drug names and quantities. Local only, never in prod.
# The old org.hibernate.type.descriptor.sql.BasicBinder category was renamed in
# Hibernate 6, so the previous line here had no effect at all.
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
# Локальная БД поднимается автоматически из compose.dev.yaml. Отдельный файл нужен потому,
# что в продовом compose.yaml логин и пароль обязательны и берутся из .env — иначе запуск
# из IDE требовал бы .env, чего быть не должно.
spring.docker.compose.file=compose.dev.yaml
# Параметры подключения подставляет spring-boot-docker-compose; строки ниже — запас на
# случай, когда БД поднята вручную (spring.docker.compose.enabled=false).
spring.datasource.url=jdbc:postgresql://localhost:5432/medapp-server-db
spring.datasource.username=medapp
spring.datasource.password=medapp
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false