# Template for the production profile.
#
# Copy to application-prod.properties (git-ignored) or provide the equivalent
# environment variables. No real secret belongs in this file or in git.
#
# Every placeholder below without a default MUST be supplied at startup, otherwise
# the application fails fast instead of booting with a weak value.

spring.application.name=MedAppServer

# JWT signing keys. These are RESOURCE LOCATIONS, not key contents:
# a PEM pasted directly into the variable will not resolve.
rsa.private-key=${RSA_PRIVATE_KEY_LOCATION:file:/run/secrets/jwt-private.pem}
rsa.public-key=${RSA_PUBLIC_KEY_LOCATION:file:/run/secrets/jwt-public.pem}

# Shared registration barrier. Keeps casual bots out; it is not a security
# boundary, since the value ships inside the client application.
registration.secret=${REGISTRATION_SECRET}
registration.timeout.InSeconds=${REGISTRATION_TIMEOUT_SECONDS:300}
registration.timeout.BanNumber=${REGISTRATION_BAN_NUMBER:3}

medkit.share.termInMinutes=${MEDKIT_SHARE_TERM_MINUTES:15}
authentication.termInMinutes=${AUTHENTICATION_TERM_MINUTES:10}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/medapp-server-db}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# API docs are not served in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.devtools.add-properties=false

# Logging: console only, by design. Bind values are never logged — they would
# contain drug names and quantities.
logging.level.root=INFO
logging.level.org.kert0n.medappserver=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Server
server.port=${SERVER_PORT:8080}

# Behind Caddy, request.getRemoteAddr() is the proxy container address, which makes
# the registration limit a single shared counter for every client on the planet.
# "native" installs Tomcat's RemoteIpValve, which honours X-Forwarded-For only when
# the immediate peer is in server.tomcat.remoteip.internal-proxies — private ranges
# by default, i.e. the compose network. Do NOT use "framework": ForwardedHeaderFilter
# trusts the header from anyone. This holds only while the backend port is not
# published to the host; compose keeps it on the internal network.
server.forward-headers-strategy=native
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
