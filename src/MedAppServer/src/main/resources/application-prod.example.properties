# Copy to the ignored application-prod.properties or provide equivalent environment variables.
registration.secret=${REGISTRATION_SECRET}
registration.throttle.window=${REGISTRATION_THROTTLE_WINDOW:5m}
registration.throttle.max-successful-registrations=${REGISTRATION_THROTTLE_MAX:3}

authentication.term=${AUTHENTICATION_TERM:10m}
authentication.issuer=${AUTHENTICATION_ISSUER:medapp-server}
authentication.audience=${AUTHENTICATION_AUDIENCE:medapp-api}
medkit.share.termInMinutes=${MEDKIT_SHARE_TERM_MINUTES:15}

rsa.private-key=${RSA_PRIVATE_KEY:file:/run/secrets/jwt-private.pem}
rsa.public-key=${RSA_PUBLIC_KEY:file:/run/secrets/jwt-public.pem}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-migration-naming=true

server.forward-headers-strategy=NATIVE
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_CIDR:172.30.0.0/24}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=WARN
logging.level.org.kert0n.medappserver=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
