spring.application.name=MedAppServer-Test
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem
registration.secret=test-secret
authentication.term=60m
authentication.issuer=medapp-server-test
authentication.audience=medapp-api
registration.throttle.window=30s
registration.throttle.max-successful-registrations=1
medkit.share.termInMinutes=525600
spring.jpa.open-in-view=false
# H2 Test Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Logging
logging.level.root=WARN
logging.level.org.kert0n.medappserver=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.hibernate.SQL=DEBUG
