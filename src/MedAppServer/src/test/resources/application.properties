spring.application.name=MedAppServer-Test
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem
registration.secret=test-secret
authentication.termInMinutes=60
registration.timeout.InSeconds=30
registration.timeout.BanNumber=1
medkit.share.termInMinutes=525600
# ЭКСПЕРИМЕНТ: H2 больше нет — источник схемы один, и это Postgres в контейнере.
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///medapp
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
# Logging
logging.level.root=WARN
logging.level.org.kert0n.medappserver=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.hibernate.SQL=DEBUG
# Та же точка входа, что и в dev: иначе тест публичной области проверял бы не тот адрес.
springdoc.swagger-ui.path=/swagger


