spring.application.name=MedAppServer-QueryPlan
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem
registration.secret=test-secret
authentication.termInMinutes=60
registration.timeout.InSeconds=30
registration.timeout.BanNumber=1
medkit.share.termInMinutes=525600
spring.jpa.open-in-view=false
# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log=false
# Logging
logging.level.root=WARN
logging.level.org.kert0n.medappserver=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.hibernate.SQL=DEBUG
# Connection is supplied by Testcontainers.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Production schema is initialized from schema.sql and validated by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:db/schema.sql
logging.level.org.hibernate.SQL=WARN
