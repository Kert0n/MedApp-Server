spring.application.name=MedAppServer-QueryPlan
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem
registration.secret=test-secret
authentication.termInMinutes=60
registration.timeout.InSeconds=30
registration.timeout.BanNumber=1
medkit.share.termInMinutes=525600
spring.jpa.open-in-view=false
# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log=false
# Logging
logging.level.root=WARN
logging.level.org.kert0n.medappserver=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.hibernate.SQL=DEBUG
# Подключение подставляет @ServiceConnection из Testcontainers: планы запросов имеют смысл
# только на настоящем Postgres, поэтому H2-настроек здесь нет вовсе.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Схема берётся из db/schema.sql — той же, что применяется в проде.
#
# Это не мелочь: Hibernate из сущностей не создаёт ни триграммных индексов, ни
# генерируемой колонки search_tsv — их нельзя выразить аннотациями JPA, и живут они только
# в этом файле. С ddl-auto=create-drop набор проверял бы схему, которой в проде нет, и
# поиск по каталогу «честно» уходил бы в Seq Scan за отсутствием индексов.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:db/schema.sql
logging.level.org.hibernate.SQL=WARN
