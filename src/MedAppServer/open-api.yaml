openapi: 3.1.0
info:
  title: MedApp Server API
  description: REST API for MedApp medicine kit synchronization and catalog search.
  version: 0.0.1
servers:
- url: http://localhost
  description: Generated server url
security:
- Bearer Authentication: []
tags:
- name: User Data
  description: Endpoints for user profile and synchronization data
- name: Authentication
  description: Public endpoints for registration and token issuance
paths:
  /v1/med-kits/{targetMedKitId}/drugs/{drugId}:
    put:
      tags:
      - Drugs
      summary: Idempotently move a drug
      operationId: moveDrug
      parameters:
      - name: targetMedKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
  /v1/intakes/{intakeId}:
    put:
      tags:
      - Treatment plans and intakes
      operationId: intake
      parameters:
      - name: intakeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IntakeResultDTO"
  /v1/treatment-plans:
    get:
      tags:
      - Treatment plans and intakes
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreatmentPlanDTO"
    post:
      tags:
      - Treatment plans and intakes
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreatmentPlanCreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TreatmentPlanDTO"
  /v1/med-kits:
    get:
      tags:
      - Medkits
      operationId: list_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedKitSummaryDTO"
                uniqueItems: true
    post:
      tags:
      - Medkits
      operationId: create_1
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitCreatedResponse"
  /v1/med-kits/{medKitId}/invitations:
    post:
      tags:
      - Medkits
      operationId: invitation
      parameters:
      - name: medKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitInvitationDTO"
  /v1/med-kits/{medKitId}/drugs:
    post:
      tags:
      - Drugs
      summary: Create a drug in a medkit
      operationId: createDrug
      parameters:
      - name: medKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugCreateDTO"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
  /v1/med-kit-memberships:
    post:
      tags:
      - Medkits
      operationId: join
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinMedKitRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitDTO"
  /v1/drugs/{drugId}/consumptions:
    post:
      tags:
      - Drugs
      summary: Consume stock
      operationId: consumeDrug
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugConsumptionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
  /v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new user
      description: Creates a new user and returns generated credentials.
      operationId: register
      parameters:
      - name: X-Registration-Token
        in: header
        description: Shared registration secret
        required: true
        schema:
          type: string
        example: dev-secret
      responses:
        "200":
          description: User registered
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "403":
          description: Invalid registration secret
        "429":
          description: Too many registration attempts
  /v1/treatment-plans/{drugId}:
    get:
      tags:
      - Treatment plans and intakes
      operationId: get
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TreatmentPlanDTO"
    delete:
      tags:
      - Treatment plans and intakes
      operationId: delete
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - Treatment plans and intakes
      operationId: patch
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreatmentPlanPatchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TreatmentPlanDTO"
  /v1/drugs/{drugId}:
    get:
      tags:
      - Drugs
      summary: Get an accessible drug
      operationId: getDrug
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
    delete:
      tags:
      - Drugs
      operationId: deleteDrug
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - Drugs
      summary: Correct drug fields or increase stock
      operationId: patchDrug
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugPatchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
  /v1/users/me:
    get:
      tags:
      - User Data
      summary: Get user snapshot
      description: Returns user identifier with all accessible medkits and drugs for
        sync.
      operationId: getAllDataForUser
      responses:
        "200":
          description: User snapshot retrieved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          description: Unauthorized
  /v1/med-kits/{medKitId}:
    get:
      tags:
      - Medkits
      operationId: content
      parameters:
      - name: medKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitDTO"
    delete:
      tags:
      - Medkits
      operationId: delete_1
      parameters:
      - name: medKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /v1/drug-templates:
    get:
      tags:
      - Drugs
      operationId: searchDrugTemplates
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 50
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugTemplateDTO"
  /v1/drug-templates/{templateId}:
    get:
      tags:
      - Drugs
      operationId: getDrugTemplate
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugTemplateDTO"
  /v1/auth/login:
    get:
      tags:
      - Authentication
      summary: Issue JWT token
      description: Uses HTTP Basic authentication and returns a JWT access token.
      operationId: login
      responses:
        "200":
          description: JWT token issued
          content:
            '*/*':
              schema:
                type: string
        "401":
          description: Invalid credentials
      security:
      - Basic Authentication: []
  /v1/med-kit-memberships/{medKitId}:
    delete:
      tags:
      - Medkits
      operationId: leave
      parameters:
      - name: medKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
components:
  schemas:
    DrugDTO:
      type: object
      description: Drug stock and descriptive fields
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: number
        plannedQuantity:
          type: number
        availableQuantity:
          type: number
        quantityUnit:
          type: string
        formType:
          type: string
        category:
          type: string
        manufacturer:
          type: string
        country:
          type: string
        description:
          type: string
        medKitId:
          type: string
          format: uuid
    IntakeRequest:
      type: object
      description: Register an intake using the idempotency key from the path
      properties:
        drugId:
          type: string
          format: uuid
        quantityConsumed:
          type: number
          minimum: 0.0
      required:
      - drugId
      - quantityConsumed
    IntakeResultDTO:
      type: object
      description: Idempotently recorded intake
      properties:
        drugId:
          type: string
          format: uuid
        quantityConsumed:
          type: number
        treatmentPlan:
          $ref: "#/components/schemas/TreatmentPlanDTO"
    TreatmentPlanDTO:
      type: object
      description: Treatment plan owned by the authenticated user
      properties:
        userId:
          type: string
          format: uuid
        drugId:
          type: string
          format: uuid
        plannedAmount:
          type: number
    TreatmentPlanCreateRequest:
      type: object
      description: Create treatment plan request
      properties:
        drugId:
          type: string
          format: uuid
        plannedAmount:
          type: number
          minimum: 0.0
      required:
      - drugId
      - plannedAmount
    MedKitCreatedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Created medkit ID
      required:
      - id
    MedKitInvitationDTO:
      type: object
      description: Short-lived invitation to a medkit
      properties:
        key:
          type: string
    DrugCreateDTO:
      type: object
      description: Request to create a drug in the medkit identified by the path
      properties:
        name:
          type: string
          maxLength: 300
          minLength: 1
        quantity:
          type: number
          minimum: 0.0
        quantityUnit:
          type: string
          maxLength: 50
          minLength: 1
        formType:
          type: string
          maxLength: 100
          minLength: 0
        category:
          type: string
          maxLength: 200
          minLength: 0
        manufacturer:
          type: string
          maxLength: 300
          minLength: 0
        country:
          type: string
          maxLength: 100
          minLength: 0
        description:
          type: string
          maxLength: 4000
          minLength: 0
      required:
      - name
      - quantity
      - quantityUnit
    JoinMedKitRequest:
      type: object
      description: Join medkit request
      properties:
        key:
          type: string
          description: Share key to join medkit
          example: share-key-123
          minLength: 1
      required:
      - key
    MedKitDTO:
      type: object
      description: Medkit with drugs
      properties:
        id:
          type: string
          format: uuid
          description: Medkit ID
        drugs:
          type: array
          description: Drugs in medkit
          items:
            $ref: "#/components/schemas/DrugDTO"
          uniqueItems: true
    DrugConsumptionRequest:
      type: object
      description: Request to consume stock
      properties:
        quantity:
          type: number
          minimum: 0.0
      required:
      - quantity
    RegisterResponse:
      type: object
      description: Registration response with generated credentials
      properties:
        login:
          type: string
          format: uuid
          description: Generated login identifier
        key:
          type: string
          description: Generated secret key for authentication
    TreatmentPlanPatchRequest:
      type: object
      description: Patch treatment plan request
      properties:
        plannedAmount:
          type: number
          minimum: 0.0
      required:
      - plannedAmount
    DrugPatchRequest:
      type: object
      description: Partial correction; null means that the field is unchanged
      properties:
        name:
          type: string
          maxLength: 300
          minLength: 1
        quantity:
          type: number
          minimum: 0.0
        quantityUnit:
          type: string
          maxLength: 50
          minLength: 1
        formType:
          type: string
          maxLength: 100
          minLength: 0
        category:
          type: string
          maxLength: 200
          minLength: 0
        manufacturer:
          type: string
          maxLength: 300
          minLength: 0
        country:
          type: string
          maxLength: 100
          minLength: 0
        description:
          type: string
          maxLength: 4000
          minLength: 0
    UserDto:
      type: object
      description: Full user snapshot
      properties:
        id:
          type: string
          format: uuid
          description: User identifier
        medKits:
          type: array
          description: All medkits available to the user
          items:
            $ref: "#/components/schemas/MedKitDTO"
          uniqueItems: true
    MedKitSummaryDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Medkit ID
        userCount:
          type: integer
          format: int64
          description: Number of users in medkit
        drugCount:
          type: integer
          format: int64
          description: Number of drugs in medkit
      required:
      - drugCount
      - id
      - userCount
    DrugTemplateDTO:
      type: object
      description: Drug template from the catalog
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nameLat:
          type: string
        activeSubstance:
          type: string
        formType:
          type: string
        category:
          type: string
        quantityUnit:
          type: string
        manufacturer:
          type: string
        country:
          type: string
        description:
          type: string
  securitySchemes:
    Bearer Authentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
    Basic Authentication:
      type: http
      description: "Логин — идентификатор из ответа на регистрацию, пароль — выдан\
        ный ключ."
      scheme: basic
