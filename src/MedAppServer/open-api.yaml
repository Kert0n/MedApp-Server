openapi: 3.1.0
info:
  title: MedApp Server API
  description: REST API for MedApp medicine kit synchronization and catalog search.
  version: 0.0.1
servers:
- url: http://localhost
  description: Generated server url
security:
- Bearer Authentication: []
tags:
- name: Medicine kit memberships
  description: Participation of the caller in shared kits
- name: User
  description: The authenticated user
- name: Drug catalogue
  description: Reference catalogue used when adding a drug
- name: Treatment plans
  description: How much of a drug the user reserved for themselves
- name: Medicine kits
  description: Shared medicine kits
- name: Authentication
  description: Public endpoints for registration and token issuance
- name: Drugs
  description: Drugs stored in medicine kits
- name: Intakes
  description: Recorded intakes of planned drugs
paths:
  /v1/med-kits/{targetMedKitId}/drugs/{drugId}:
    put:
      tags:
      - Drugs
      summary: Move a drug to another medicine kit
      description: Transfers the drug between kits.
      operationId: moveDrug
      parameters:
      - name: targetMedKitId
        in: path
        description: Target medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Drug moved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
        "404":
          description: Drug or target kit is not accessible
        "401":
          description: Authentication is required
  /v1/intakes/{intakeId}:
    put:
      tags:
      - Intakes
      summary: Record an intake
      description: "Not enabled yet: the endpoint answers 501. The final behaviour\
        \ applies the intake once — repeating the request with the same identifier\
        \ returns the first result instead of consuming again — and arrives together\
        \ with optimistic concurrency."
      operationId: recordIntake
      parameters:
      - name: intakeId
        in: path
        description: Client-generated intake identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Intake details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeRequest"
        required: true
      responses:
        "501":
          description: Intake is not enabled yet
        "401":
          description: Authentication is required
  /v1/treatment-plans:
    get:
      tags:
      - Treatment plans
      summary: List treatment plans
      description: Returns every plan of the caller.
      operationId: listTreatmentPlans
      responses:
        "200":
          description: Plans returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreatmentPlanDTO"
        "401":
          description: Authentication is required
    post:
      tags:
      - Treatment plans
      summary: Create a treatment plan
      description: Reserves an amount of a drug for the caller.
      operationId: createTreatmentPlan
      requestBody:
        description: Plan to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreatmentPlanCreateRequest"
        required: true
      responses:
        "201":
          description: Plan created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TreatmentPlanDTO"
        "400":
          description: Amount exceeds the available stock
        "404":
          description: Drug is not accessible
        "409":
          description: Plan for this drug already exists
        "401":
          description: Authentication is required
  /v1/med-kits:
    get:
      tags:
      - Medicine kits
      summary: List medicine kits
      description: "Returns counters for every kit of the caller, without loading\
        \ their contents."
      operationId: listMedKits
      responses:
        "200":
          description: Kits returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedKitSummaryDTO"
                uniqueItems: true
        "401":
          description: Authentication is required
    post:
      tags:
      - Medicine kits
      summary: Create a medicine kit
      description: Creates a kit owned by nobody in particular.
      operationId: createMedKit
      responses:
        "201":
          description: Kit created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitCreatedDTO"
        "401":
          description: Authentication is required
  /v1/med-kits/{medKitId}/invitations:
    post:
      tags:
      - Medicine kits
      summary: Create an invitation
      description: Issues a key others can use to join the kit.
      operationId: createInvitation
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          description: Invitation created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvitationDTO"
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
  /v1/med-kits/{medKitId}/drugs:
    post:
      tags:
      - Drugs
      summary: Add a drug to a medicine kit
      description: Creates a drug in the given kit.
      operationId: createDrug
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Drug to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugCreateRequest"
        required: true
      responses:
        "201":
          description: Drug created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
        "400":
          description: Invalid request
        "404":
          description: Medicine kit is not accessible
        "401":
          description: Authentication is required
  /v1/med-kit-memberships:
    post:
      tags:
      - Medicine kit memberships
      summary: Join a medicine kit
      description: Accepts an invitation and joins the kit.
      operationId: joinMedKit
      requestBody:
        description: Invitation key
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipCreateRequest"
        required: true
      responses:
        "201":
          description: Joined
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitDTO"
        "404":
          description: Invitation expired or unknown
        "401":
          description: Authentication is required
  /v1/drugs/{drugId}/consumptions:
    post:
      tags:
      - Drugs
      summary: Consume a drug
      description: Reduces the stock by the given amount outside any treatment plan.
        Returns no body when the drug ran out and was removed.
      operationId: consumeDrug
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Amount consumed
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumptionRequest"
        required: true
      responses:
        "200":
          description: Stock reduced
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
        "204":
          description: Drug ran out and was removed
        "400":
          description: Amount exceeds the stock
        "404":
          description: Drug does not exist or is not accessible
        "401":
          description: Authentication is required
  /v1/auth/token:
    post:
      tags:
      - Authentication
      summary: Issue JWT token
      description: "Uses HTTP Basic authentication and returns a JWT access token.\
        \ The token carries its own expiry in the `exp` claim; use it as `Authorization:\
        \ Bearer <token>`."
      operationId: token
      responses:
        "200":
          description: JWT token issued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
        "429":
          description: Too many token requests
      security:
      - Basic Authentication: []
  /v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new user
      description: Creates a new user and returns generated credentials.
      operationId: register
      parameters:
      - name: X-Registration-Token
        in: header
        description: Shared registration secret
        required: true
        schema:
          type: string
        example: dev-secret
      responses:
        "200":
          description: User registered
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "403":
          description: Invalid registration secret
        "429":
          description: Too many registration attempts
  /v1/treatment-plans/{drugId}:
    get:
      tags:
      - Treatment plans
      summary: Get a treatment plan
      description: Returns the caller's plan for the drug.
      operationId: getTreatmentPlan
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Plan found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TreatmentPlanDTO"
        "404":
          description: No plan for this drug
        "401":
          description: Authentication is required
    delete:
      tags:
      - Treatment plans
      summary: Delete a treatment plan
      description: Releases the reserved amount.
      operationId: deleteTreatmentPlan
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Plan deleted
        "404":
          description: No plan for this drug
        "401":
          description: Authentication is required
    patch:
      tags:
      - Treatment plans
      summary: Change the planned amount
      description: Sets a new planned amount for the drug.
      operationId: patchTreatmentPlan
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: New planned amount
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreatmentPlanPatchRequest"
        required: true
      responses:
        "200":
          description: Plan updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TreatmentPlanDTO"
        "400":
          description: Amount exceeds the available stock
        "404":
          description: No plan for this drug
        "401":
          description: Authentication is required
  /v1/drugs/{drugId}:
    get:
      tags:
      - Drugs
      summary: Get a drug
      description: Returns a drug the caller has access to.
      operationId: getDrug
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Drug found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
        "404":
          description: Drug does not exist or is not accessible
        "401":
          description: Authentication is required
    delete:
      tags:
      - Drugs
      summary: Delete a drug
      description: Removes the drug and every treatment plan for it.
      operationId: deleteDrug
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Drug deleted
        "404":
          description: Drug does not exist or is not accessible
        "401":
          description: Authentication is required
    patch:
      tags:
      - Drugs
      summary: Update a drug
      description: Changes the given fields. Absent fields are left as they are; quantity
        may only increase — use consumptions to reduce it.
      operationId: patchDrug
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Fields to change
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugPatchRequest"
        required: true
      responses:
        "200":
          description: Drug updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
        "400":
          description: Invalid request
        "404":
          description: Drug does not exist or is not accessible
        "401":
          description: Authentication is required
  /v1/users/me:
    get:
      tags:
      - User
      summary: Get the caller's snapshot
      description: "Returns the caller identifier with every accessible medicine kit\
        \ and its drugs, for sync."
      operationId: getSnapshot
      responses:
        "200":
          description: Snapshot returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSnapshotDTO"
        "401":
          description: Authentication is required
  /v1/med-kits/{medKitId}:
    get:
      tags:
      - Medicine kits
      summary: Get a medicine kit
      description: Returns the kit with its drugs.
      operationId: getMedKit
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Kit found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitDTO"
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
    delete:
      tags:
      - Medicine kits
      summary: Delete a medicine kit
      description: "Deletes the kit for every participant, including its drugs and\
        \ their treatment plans. Use when the physical kit no longer exists as a shared\
        \ thing. Pass targetMedKitId to move the drugs into another kit of yours instead\
        \ of discarding them. To leave a shared kit without destroying it, delete\
        \ your membership instead."
      operationId: deleteMedKit
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: targetMedKitId
        in: query
        description: Kit to move the drugs into instead of discarding them
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Kit deleted for everyone
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
  /v1/drug-templates:
    get:
      tags:
      - Drug catalogue
      summary: Search the catalogue
      description: "Searches by name, Latin name, active substance and manufacturer."
      operationId: searchDrugTemplates
      parameters:
      - name: query
        in: query
        description: Search query
        required: true
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - name: limit
        in: query
        description: Maximum number of results
        required: false
        schema:
          type: integer
          format: int32
          maximum: 50
          minimum: 1
      responses:
        "200":
          description: Matches found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugTemplateDTO"
        "400":
          description: Invalid query or limit
        "401":
          description: Authentication is required
  /v1/drug-templates/{templateId}:
    get:
      tags:
      - Drug catalogue
      summary: Get a catalogue entry
      description: Returns a single catalogue entry.
      operationId: getDrugTemplate
      parameters:
      - name: templateId
        in: path
        description: Template identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Entry found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugTemplateDTO"
        "404":
          description: Entry does not exist
        "401":
          description: Authentication is required
  /v1/med-kit-memberships/{medKitId}:
    delete:
      tags:
      - Medicine kit memberships
      summary: Leave a medicine kit
      description: Removes the caller from the kit together with their treatment plans
        in it. The kit itself and other participants stay.
      operationId: leaveMedKit
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Left the kit
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
components:
  schemas:
    DrugDTO:
      type: object
      description: Drug stock and descriptive fields
      properties:
        id:
          type: string
          format: uuid
          description: Drug identifier
        name:
          type: string
          description: Drug name
          example: Aspirin
        quantity:
          type: number
          description: Current stock
          example: 100.0
        plannedQuantity:
          type: number
          description: Sum of all treatment plans for this drug
          example: 30.0
        availableQuantity:
          type: number
          description: Stock not reserved by treatment plans
          example: 70.0
        quantityUnit:
          type: string
          description: Quantity unit
          example: mg
        formType:
          type: string
          description: Dosage form
          example: tablet
        category:
          type: string
          description: Category
          example: painkiller
        manufacturer:
          type: string
          description: Manufacturer
          example: Bayer
        country:
          type: string
          description: Country
          example: Germany
        description:
          type: string
          description: Description
        medKitId:
          type: string
          format: uuid
          description: Medicine kit the drug belongs to
    IntakeRequest:
      type: object
      description: Recorded intake of a planned drug
      properties:
        drugId:
          type: string
          format: uuid
          description: Drug identifier
        quantityConsumed:
          type: number
          description: "Amount consumed, greater than zero"
          example: 1.0
          minimum: 0.0
      required:
      - drugId
      - quantityConsumed
    TreatmentPlanCreateRequest:
      type: object
      description: Request to reserve an amount of a drug
      properties:
        drugId:
          type: string
          format: uuid
          description: Drug identifier
        plannedAmount:
          type: number
          description: "Planned amount, greater than zero"
          example: 20.0
          minimum: 0.0
      required:
      - drugId
      - plannedAmount
    TreatmentPlanDTO:
      type: object
      description: How much of a drug the user reserved for themselves
      properties:
        drugId:
          type: string
          format: uuid
          description: Drug the plan belongs to
        plannedAmount:
          type: number
          description: Planned amount for the course
          example: 20.0
    MedKitCreatedDTO:
      type: object
      description: Created medicine kit
      properties:
        id:
          type: string
          format: uuid
          description: Medicine kit identifier
    InvitationDTO:
      type: object
      description: Invitation to join a medicine kit
      properties:
        key:
          type: string
          description: Key to join the kit; valid for a limited time and reusable
            within it
    DrugCreateRequest:
      type: object
      description: Request to add a drug to a medicine kit
      properties:
        name:
          type: string
          description: Drug name
          example: Aspirin
          maxLength: 300
          minLength: 1
        quantity:
          type: number
          description: "Initial stock, greater than zero"
          example: 100.0
          minimum: 0.0
        quantityUnit:
          type: string
          description: Quantity unit
          example: mg
          maxLength: 50
          minLength: 1
        formType:
          type: string
          description: Dosage form
          example: tablet
          maxLength: 100
          minLength: 0
        category:
          type: string
          description: Category
          example: painkiller
          maxLength: 200
          minLength: 0
        manufacturer:
          type: string
          description: Manufacturer
          example: Bayer
          maxLength: 300
          minLength: 0
        country:
          type: string
          description: Country
          example: Germany
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Description
          maxLength: 4000
          minLength: 0
      required:
      - name
      - quantity
      - quantityUnit
    MembershipCreateRequest:
      type: object
      description: Request to join a medicine kit by invitation
      properties:
        key:
          type: string
          description: Invitation key
          example: sSQUCT8iOjYsobZ7StyspQ
      required:
      - key
    MedKitDTO:
      type: object
      description: Medicine kit with its drugs
      properties:
        id:
          type: string
          format: uuid
          description: Medicine kit identifier
        drugs:
          type: array
          description: Drugs stored in the kit
          items:
            $ref: "#/components/schemas/DrugDTO"
          uniqueItems: true
    ConsumptionRequest:
      type: object
      description: Unplanned consumption of a drug
      properties:
        quantity:
          type: number
          description: "Amount consumed, greater than zero"
          example: 2.0
          minimum: 0.0
      required:
      - quantity
    TokenResponse:
      type: object
      description: Issued access token
      properties:
        accessToken:
          type: string
          description: JWT access token
    RegisterResponse:
      type: object
      description: Registration response with generated credentials
      properties:
        login:
          type: string
          format: uuid
          description: Generated login identifier
        key:
          type: string
          description: Generated secret key for authentication
    TreatmentPlanPatchRequest:
      type: object
      description: Request to change the planned amount
      properties:
        plannedAmount:
          type: number
          description: "New planned amount, greater than zero"
          example: 15.0
          minimum: 0.0
      required:
      - plannedAmount
    DrugPatchRequest:
      type: object
      description: Partial update of a drug
      properties:
        name:
          type: string
          description: Drug name
          example: Aspirin
          maxLength: 300
          minLength: 1
        quantity:
          type: number
          description: "Corrected stock. Raising it adds to the shelf; lowering it\
            \ means a recount found less than recorded, and treatment plans are scaled\
            \ down to fit."
          example: 120.0
          minimum: 0.0
        quantityUnit:
          type: string
          description: Quantity unit
          example: mg
          maxLength: 50
          minLength: 1
        formType:
          type: string
          description: Dosage form
          example: tablet
          maxLength: 100
          minLength: 0
        category:
          type: string
          description: Category
          example: painkiller
          maxLength: 200
          minLength: 0
        manufacturer:
          type: string
          description: Manufacturer
          example: Bayer
          maxLength: 300
          minLength: 0
        country:
          type: string
          description: Country
          example: Germany
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Description
          maxLength: 4000
          minLength: 0
    UserSnapshotDTO:
      type: object
      description: "Everything the caller can see, in one response"
      properties:
        id:
          type: string
          format: uuid
          description: Caller identifier
        medKits:
          type: array
          description: All medicine kits available to the caller
          items:
            $ref: "#/components/schemas/MedKitDTO"
          uniqueItems: true
    MedKitSummaryDTO:
      type: object
      description: Medicine kit counters without loading its contents
      properties:
        id:
          type: string
          format: uuid
          description: Medicine kit identifier
        userCount:
          type: integer
          format: int64
          description: Number of participants
          example: 2
        drugCount:
          type: integer
          format: int64
          description: Number of drugs
          example: 17
    DrugTemplateDTO:
      type: object
      description: Catalogue entry used as a template for a new drug
      properties:
        id:
          type: string
          format: uuid
          description: Template identifier
        name:
          type: string
          description: Drug name
          example: Аспирин
        nameLat:
          type: string
          description: International name in Latin script
          example: Aspirin
        activeSubstance:
          type: string
          description: Active substance
          example: Acetylsalicylic acid
        formType:
          type: string
          description: Dosage form
          example: таблетки
        category:
          type: string
          description: Category
        quantityUnit:
          type: string
          description: Quantity unit
          example: шт
        manufacturer:
          type: string
          description: Manufacturer
          example: Bayer
        country:
          type: string
          description: Country
          example: Германия
        description:
          type: string
          description: Description
  securitySchemes:
    Bearer Authentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
    Basic Authentication:
      type: http
      description: "Login is the identifier from registration, password is the key"
      scheme: basic
