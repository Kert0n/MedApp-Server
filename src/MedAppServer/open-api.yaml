openapi: 3.1.0
info:
  title: MedApp Server API
  description: REST API for MedApp medicine kit synchronization and catalog search.
  version: 0.0.1
servers:
- url: http://localhost
  description: Generated server url
security:
- Bearer Authentication: []
tags:
- name: Users
  description: Current-user synchronization data
- name: Drugs
  description: Stock stored in medicine kits
- name: Drug catalogue
  description: Searchable drug templates
- name: Treatment plans
  description: Drug amounts reserved by the current user
- name: Medicine kits
  description: Shared medicine-kit lifecycle and content
- name: Authentication
  description: Public endpoints for registration and token issuance
- name: Intakes
  description: Idempotent planned drug intake
paths:
  /v1/med-kits/{targetMedKitId}/drugs/{drugId}:
    put:
      tags:
      - Drugs
      summary: Move a drug to another medicine kit
      operationId: move
      parameters:
      - name: targetMedKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
  /v1/intakes/{intakeId}:
    put:
      tags:
      - Intakes
      summary: Register an idempotent intake
      operationId: record
      parameters:
      - name: intakeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IntakeResultDTO"
  /v1/treatment-plans:
    get:
      tags:
      - Treatment plans
      summary: List own treatment plans
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreatmentPlanDTO"
    post:
      tags:
      - Treatment plans
      summary: Create a treatment plan
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreatmentPlanCreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TreatmentPlanDTO"
  /v1/med-kits:
    get:
      tags:
      - Medicine kits
      summary: List accessible medicine kits
      operationId: list_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedKitSummaryDTO"
    post:
      tags:
      - Medicine kits
      summary: Create a medicine kit
      operationId: create_1
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitCreatedDTO"
  /v1/med-kits/{medKitId}/invitations:
    post:
      tags:
      - Medicine kits
      summary: Create an invitation
      operationId: invite
      parameters:
      - name: medKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitInvitationDTO"
  /v1/med-kits/{medKitId}/drugs:
    post:
      tags:
      - Drugs
      summary: Create a drug in the medicine kit
      operationId: create_2
      parameters:
      - name: medKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugCreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
  /v1/med-kit-memberships:
    post:
      tags:
      - Medicine kits
      summary: Join a medicine kit
      operationId: join
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedKitMembershipCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitCreatedDTO"
  /v1/drugs/{drugId}/consumptions:
    post:
      tags:
      - Drugs
      summary: Consume unplanned stock
      operationId: consume
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugConsumptionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
  /v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new user
      description: Creates a new user and returns generated credentials.
      operationId: register
      parameters:
      - name: X-Registration-Token
        in: header
        description: Shared registration secret
        required: true
        schema:
          type: string
        example: dev-secret
      responses:
        "200":
          description: User registered
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "403":
          description: Invalid registration secret
        "429":
          description: Too many registration attempts
  /v1/treatment-plans/{drugId}:
    get:
      tags:
      - Treatment plans
      summary: Get own treatment plan for a drug
      operationId: get
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TreatmentPlanDTO"
    delete:
      tags:
      - Treatment plans
      summary: Delete a treatment plan
      operationId: delete
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - Treatment plans
      summary: Change a treatment plan
      operationId: patch
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreatmentPlanPatchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TreatmentPlanDTO"
  /v1/drugs/{drugId}:
    get:
      tags:
      - Drugs
      summary: Get an accessible drug
      operationId: get_1
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
    delete:
      tags:
      - Drugs
      summary: Delete a drug
      operationId: delete_1
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - Drugs
      summary: Correct drug fields or increase stock
      operationId: patch_1
      parameters:
      - name: drugId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugPatchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
  /v1/users/me:
    get:
      tags:
      - Users
      summary: Get the current user snapshot
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSnapshotDTO"
  /v1/med-kits/{medKitId}:
    get:
      tags:
      - Medicine kits
      summary: Get medicine-kit content
      operationId: get_2
      parameters:
      - name: medKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitContentDTO"
    delete:
      tags:
      - Medicine kits
      summary: "Delete a medicine kit, optionally transferring its drugs"
      operationId: delete_2
      parameters:
      - name: medKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: targetMedKitId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /v1/drug-templates:
    get:
      tags:
      - Drug catalogue
      summary: Search drug templates
      operationId: search
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          default: ""
          maxLength: 200
          minLength: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 50
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugTemplateDTO"
  /v1/drug-templates/{templateId}:
    get:
      tags:
      - Drug catalogue
      summary: Get a drug template
      operationId: get_3
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugTemplateDTO"
  /v1/auth/login:
    get:
      tags:
      - Authentication
      summary: Issue JWT token
      description: Uses HTTP Basic authentication and returns a JWT access token.
      operationId: login
      responses:
        "200":
          description: JWT token issued
          content:
            '*/*':
              schema:
                type: string
        "401":
          description: Invalid credentials
  /v1/med-kit-memberships/{medKitId}:
    delete:
      tags:
      - Medicine kits
      summary: Leave a medicine kit
      operationId: leave
      parameters:
      - name: medKitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
components:
  schemas:
    DrugDTO:
      type: object
      description: Drug with stock and treatment-plan totals
      properties:
        id:
          type: string
          format: uuid
          description: Drug identifier
        medKitId:
          type: string
          format: uuid
          description: Medicine kit identifier
        name:
          type: string
          description: Drug name
          example: Aspirin
        quantity:
          type: number
          description: Current stock
          example: 100.0
        plannedQuantity:
          type: number
          description: Total amount reserved by treatment plans
        availableQuantity:
          type: number
          description: Unreserved stock
        quantityUnit:
          type: string
          description: Unit used for stock and plans
          example: tablet
        formType:
          type: string
          description: Dosage form
        category:
          type: string
          description: Drug category
        manufacturer:
          type: string
          description: Manufacturer
        country:
          type: string
          description: Country of manufacture
        description:
          type: string
          description: Free-form description
    IntakeRequest:
      type: object
      description: Register one planned intake
      properties:
        quantity:
          type: number
          description: Positive consumed amount
          minimum: 0
        drugId:
          type: string
          format: uuid
          description: Drug identifier
      required:
      - drugId
      - quantity
    IntakeResultDTO:
      type: object
      description: Committed intake result; drug or plan can disappear when exhausted
      properties:
        drug:
          $ref: "#/components/schemas/DrugDTO"
          description: "Drug after intake, or null when exhausted"
        plan:
          $ref: "#/components/schemas/TreatmentPlanDTO"
          description: "Plan after intake, or null when completed"
    TreatmentPlanDTO:
      type: object
      description: Treatment plan owned by the current user
      properties:
        userId:
          type: string
          format: uuid
          description: User identifier
        drugId:
          type: string
          format: uuid
          description: Drug identifier
        plannedAmount:
          type: number
          description: Amount reserved for the treatment course
    TreatmentPlanCreateRequest:
      type: object
      description: Create a treatment plan
      properties:
        drugId:
          type: string
          format: uuid
          description: Drug identifier
        plannedAmount:
          type: number
          description: Positive amount to reserve
          minimum: 0
      required:
      - drugId
      - plannedAmount
    MedKitCreatedDTO:
      type: object
      description: Created medicine kit
      properties:
        id:
          type: string
          format: uuid
          description: Medicine kit identifier
    MedKitInvitationDTO:
      type: object
      description: Invitation to a medicine kit
      properties:
        key:
          type: string
          description: URL-safe invitation key
    DrugCreateRequest:
      type: object
      description: Fields required to create a drug in the medicine kit from the path
      properties:
        name:
          type: string
          description: Drug name
          example: Aspirin
          maxLength: 300
          minLength: 0
        quantity:
          type: number
          description: Initial stock; must be positive
          minimum: 0
        quantityUnit:
          type: string
          description: Quantity unit
          example: tablet
          maxLength: 50
          minLength: 0
        formType:
          type: string
          description: Dosage form
          maxLength: 100
          minLength: 0
        category:
          type: string
          description: Drug category
          maxLength: 200
          minLength: 0
        manufacturer:
          type: string
          description: Manufacturer
          maxLength: 300
          minLength: 0
        country:
          type: string
          description: Country of manufacture
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Free-form description
          maxLength: 4000
          minLength: 0
      required:
      - name
      - quantity
      - quantityUnit
    MedKitMembershipCreateRequest:
      type: object
      description: Join a medicine kit using an invitation
      properties:
        key:
          type: string
          description: Invitation key
          minLength: 1
      required:
      - key
    DrugConsumptionRequest:
      type: object
      description: Unplanned stock consumption
      properties:
        quantity:
          type: number
          description: Positive amount to consume
          minimum: 0
      required:
      - quantity
    RegisterResponse:
      type: object
      description: Registration response with generated credentials
      properties:
        login:
          type: string
          format: uuid
          description: Generated login identifier
        key:
          type: string
          description: Generated secret key for authentication
    TreatmentPlanPatchRequest:
      type: object
      description: Change the amount reserved by a treatment plan
      properties:
        plannedAmount:
          type: number
          description: New positive planned amount
          minimum: 0
      required:
      - plannedAmount
    DrugPatchRequest:
      type: object
      description: Partial correction; null means that the field is unchanged
      properties:
        name:
          type: string
          description: Corrected name
          maxLength: 300
          minLength: 1
        quantity:
          type: number
          description: New stock; when present it must exceed current stock
          minimum: 0
        quantityUnit:
          type: string
          description: Corrected quantity unit
          maxLength: 50
          minLength: 1
        formType:
          type: string
          description: Corrected dosage form
          maxLength: 100
          minLength: 0
        category:
          type: string
          description: Corrected category
          maxLength: 200
          minLength: 0
        manufacturer:
          type: string
          description: Corrected manufacturer
          maxLength: 300
          minLength: 0
        country:
          type: string
          description: Corrected country
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Corrected description
          maxLength: 4000
          minLength: 0
    MedKitContentDTO:
      type: object
      description: Medicine kit content
      properties:
        id:
          type: string
          format: uuid
          description: Medicine kit identifier
        drugs:
          type: array
          description: Drugs currently stored in the kit
          items:
            $ref: "#/components/schemas/DrugDTO"
    UserSnapshotDTO:
      type: object
      description: Current user synchronization snapshot
      properties:
        id:
          type: string
          format: uuid
          description: Current user identifier
        medKits:
          type: array
          description: All accessible medicine kits with their content
          items:
            $ref: "#/components/schemas/MedKitContentDTO"
    MedKitSummaryDTO:
      type: object
      description: Medicine kit summary
      properties:
        id:
          type: string
          format: uuid
          description: Medicine kit identifier
        userCount:
          type: integer
          format: int64
          description: Number of members
        drugCount:
          type: integer
          format: int64
          description: Number of drugs
    DrugTemplateDTO:
      type: object
      description: Drug catalogue template
      properties:
        id:
          type: string
          format: uuid
          description: Template identifier
        name:
          type: string
          description: Catalogue name
        formType:
          type: string
          description: Dosage form
        category:
          type: string
          description: Category
        quantityUnit:
          type: string
          description: Quantity unit
        manufacturer:
          type: string
          description: Manufacturer
        country:
          type: string
          description: Country
        description:
          type: string
          description: Description
  securitySchemes:
    Bearer Authentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
