openapi: 3.1.0
info:
  title: MedApp Server API
  description: REST API for MedApp medicine kit synchronization and catalog search.
  version: 0.0.1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Medicine kit memberships
  description: Participation of the caller in shared kits
- name: User
  description: The authenticated user
- name: Vocabularies
  description: Shared quantity units and dosage forms
- name: Drug catalogue
  description: Reference catalogue used when adding a drug
- name: Medicine kits
  description: Shared medicine kits
- name: Authentication
  description: Public endpoints for registration and token issuance
- name: Drugs
  description: Drugs stored in medicine kits
- name: Reservations
  description: How much of a package the caller claims for themselves
paths:
  /v1/med-kits/{targetMedKitId}/drugs/{drugId}:
    put:
      tags:
      - Drugs
      summary: Move a drug to another medicine kit
      description: Transfers the drug between kits.
      operationId: moveDrug
      parameters:
      - name: targetMedKitId
        in: path
        description: Target medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Drug moved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
        "404":
          description: Drug or target kit is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/reservations:
    get:
      tags:
      - Reservations
      summary: List reservations
      description: Returns every reservation of the caller.
      operationId: listReservations
      responses:
        "200":
          description: Reservations returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationDTO"
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    post:
      tags:
      - Reservations
      summary: Reserve part of a package
      description: "Claims an amount of the package for the caller. The amount may\
        \ exceed what is left in the package: how much of their own reservation to\
        \ keep is the owner's decision, not the server's."
      operationId: createReservation
      requestBody:
        description: Reservation to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCreateRequest"
        required: true
      responses:
        "201":
          description: Reservation created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationDTO"
        "400":
          description: Invalid amount
        "404":
          description: Package is not accessible
        "409":
          description: Reservation on this package already exists
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/med-kits:
    get:
      tags:
      - Medicine kits
      summary: List medicine kits
      description: "Returns counters for every kit of the caller, without loading\
        \ their contents."
      operationId: listMedKits
      responses:
        "200":
          description: Kits returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedKitSummaryDTO"
                uniqueItems: true
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    post:
      tags:
      - Medicine kits
      summary: Create a medicine kit
      description: Creates a kit owned by nobody in particular.
      operationId: createMedKit
      responses:
        "201":
          description: Kit created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitCreatedDTO"
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/med-kits/{medKitId}/invitations:
    post:
      tags:
      - Medicine kits
      summary: Create an invitation
      description: Issues a key others can use to join the kit.
      operationId: createInvitation
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          description: Invitation created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvitationDTO"
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/med-kits/{medKitId}/drugs:
    post:
      tags:
      - Drugs
      summary: Add a drug to a medicine kit
      description: Creates a drug in the given kit.
      operationId: createDrug
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Drug to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugCreateRequest"
        required: true
      responses:
        "201":
          description: Drug created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
        "400":
          description: Invalid request
        "404":
          description: Medicine kit is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/med-kit-memberships:
    post:
      tags:
      - Medicine kit memberships
      summary: Join a medicine kit
      description: Accepts an invitation and joins the kit.
      operationId: joinMedKit
      requestBody:
        description: Invitation key
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipCreateRequest"
        required: true
      responses:
        "201":
          description: Joined
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitDTO"
        "404":
          description: Invitation expired or unknown
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/drugs/{drugId}/intakes:
    post:
      tags:
      - Drugs
      summary: Record an intake
      description: "Takes the given amount out of the package — the only way its contents\
        \ decrease. There is no distinction between a planned intake and an emergency\
        \ one: what was taken reduces the package, and the reservation is the owner's\
        \ to adjust. Taking more than the package holds is refused: a package cannot\
        \ be refilled, so a second pack is a second package. Returns no body when\
        \ the package ran out and was destroyed."
      operationId: recordIntake
      parameters:
      - name: drugId
        in: path
        description: Package identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Amount taken
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeRequest"
        required: true
      responses:
        "200":
          description: Package reduced
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
        "204":
          description: Package ran out and was destroyed
        "400":
          description: Amount exceeds what is left in the package
        "404":
          description: Package does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/auth/token:
    post:
      tags:
      - Authentication
      summary: Issue JWT token
      description: "Uses HTTP Basic authentication and returns a JWT access token.\
        \ The token carries its own expiry in the `exp` claim; use it as `Authorization:\
        \ Bearer <token>`."
      operationId: token
      responses:
        "200":
          description: JWT token issued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
        "429":
          description: Too many token requests
      security:
      - Basic Authentication: []
  /v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new user
      description: Creates a new user and returns generated credentials.
      operationId: register
      parameters:
      - name: X-Registration-Token
        in: header
        description: Shared registration secret
        required: true
        schema:
          type: string
        example: dev-secret
      responses:
        "200":
          description: User registered
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "403":
          description: Invalid registration secret
        "429":
          description: Too many registration attempts
  /v1/reservations/{drugId}:
    get:
      tags:
      - Reservations
      summary: Get a reservation
      description: Returns the caller's reservation on the package.
      operationId: getReservation
      parameters:
      - name: drugId
        in: path
        description: Package identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Reservation found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationDTO"
        "404":
          description: No reservation on this package
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    delete:
      tags:
      - Reservations
      summary: Cancel a reservation
      description: "Releases the claim. A reservation of zero does not exist, so cancelling\
        \ is a deletion."
      operationId: deleteReservation
      parameters:
      - name: drugId
        in: path
        description: Package identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Reservation cancelled
        "404":
          description: No reservation on this package
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    patch:
      tags:
      - Reservations
      summary: Change the reserved amount
      description: Sets a new reserved amount. It may exceed what is left in the package.
      operationId: patchReservation
      parameters:
      - name: drugId
        in: path
        description: Package identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: New reserved amount
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationPatchRequest"
        required: true
      responses:
        "200":
          description: Reservation updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationDTO"
        "400":
          description: Invalid amount
        "404":
          description: No reservation on this package
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/drugs/{drugId}:
    get:
      tags:
      - Drugs
      summary: Get a drug
      description: Returns a drug the caller has access to.
      operationId: getDrug
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Drug found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
        "404":
          description: Drug does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    delete:
      tags:
      - Drugs
      summary: Delete a drug
      description: Destroys the package and every reservation placed on it.
      operationId: deleteDrug
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Drug deleted
        "404":
          description: Drug does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    patch:
      tags:
      - Drugs
      summary: Update a package
      description: "Changes the given fields; absent fields are left as they are.\
        \ Quantity here is a correction of the record — you recounted the pack and\
        \ saw a different number — not a refill, and it leaves reservations alone."
      operationId: patchDrug
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Fields to change
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugPatchRequest"
        required: true
      responses:
        "200":
          description: Drug updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugDTO"
        "400":
          description: Invalid request
        "404":
          description: Drug does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/users/me:
    get:
      tags:
      - User
      summary: Get the caller's snapshot
      description: "Returns the caller identifier with every accessible medicine kit\
        \ and its drugs, for sync."
      operationId: getSnapshot
      responses:
        "200":
          description: Snapshot returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSnapshotDTO"
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/quantity-units:
    get:
      tags:
      - Vocabularies
      summary: List quantity units
      description: "Shared vocabulary of quantity units. A drug references a unit\
        \ by identifier, so this list is where the identifier comes from."
      operationId: listQuantityUnits
      responses:
        "200":
          description: Units returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VocabularyEntryDTO"
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/med-kits/{medKitId}:
    get:
      tags:
      - Medicine kits
      summary: Get a medicine kit
      description: Returns the kit with its drugs.
      operationId: getMedKit
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Kit found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitDTO"
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    delete:
      tags:
      - Medicine kits
      summary: Delete a medicine kit
      description: "Deletes the kit for every participant, including its packages\
        \ and the reservations on them. Use when the physical kit no longer exists\
        \ as a shared thing. Pass targetMedKitId to move the drugs into another kit\
        \ of yours instead of discarding them. To leave a shared kit without destroying\
        \ it, delete your membership instead."
      operationId: deleteMedKit
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: targetMedKitId
        in: query
        description: Kit to move the drugs into instead of discarding them
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Kit deleted for everyone
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/form-types:
    get:
      tags:
      - Vocabularies
      summary: List dosage forms
      description: "Shared vocabulary of dosage forms, used the same way as quantity\
        \ units."
      operationId: listFormTypes
      responses:
        "200":
          description: Dosage forms returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VocabularyEntryDTO"
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/drug-templates:
    get:
      tags:
      - Drug catalogue
      summary: Search the catalogue
      description: "Searches by name, Latin name, active substance and manufacturer."
      operationId: searchDrugTemplates
      parameters:
      - name: query
        in: query
        description: Search query
        required: true
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - name: limit
        in: query
        description: Maximum number of results
        required: false
        schema:
          type: integer
          format: int32
          maximum: 50
          minimum: 1
      responses:
        "200":
          description: Matches found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugTemplateDTO"
        "400":
          description: Invalid query or limit
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/drug-templates/{templateId}:
    get:
      tags:
      - Drug catalogue
      summary: Get a catalogue entry
      description: Returns a single catalogue entry.
      operationId: getDrugTemplate
      parameters:
      - name: templateId
        in: path
        description: Template identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Entry found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugTemplateDTO"
        "404":
          description: Entry does not exist
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/med-kit-memberships/{medKitId}:
    delete:
      tags:
      - Medicine kit memberships
      summary: Leave a medicine kit
      description: Removes the caller from the kit together with their reservations
        in it. The kit itself and other participants stay.
      operationId: leaveMedKit
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Left the kit
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
components:
  schemas:
    DrugDTO:
      type: object
      description: Drug stock and descriptive fields
      properties:
        id:
          type: string
          format: uuid
          description: Drug identifier
        name:
          type: string
          description: Drug name
          example: Aspirin
        quantity:
          type: number
          description: Current stock
          example: 100.0
        reservedQuantity:
          type: number
          description: Sum of all reservations on this package; may exceed the stock
          example: 40.0
        quantityUnitId:
          type: string
          format: uuid
          description: Quantity unit identifier
        quantityUnit:
          type: string
          description: Quantity unit name
          example: mg
        formTypeId:
          type: string
          format: uuid
          description: Dosage form identifier
        formType:
          type: string
          description: Dosage form name
          example: tablet
        category:
          type: string
          description: Category
          example: painkiller
        manufacturer:
          type: string
          description: Manufacturer
          example: Bayer
        country:
          type: string
          description: Country
          example: Germany
        description:
          type: string
          description: Description
        medKitId:
          type: string
          format: uuid
          description: Medicine kit the drug belongs to
    ReservationCreateRequest:
      type: object
      description: Request to reserve part of a package
      properties:
        drugId:
          type: string
          format: uuid
          description: Package identifier
        amount:
          type: number
          description: "Reserved amount, greater than zero. It may exceed what is\
            \ left in the package."
          example: 20.0
          minimum: 0.0
      required:
      - amount
      - drugId
    ReservationDTO:
      type: object
      description: How much of a package the caller claims for themselves
      properties:
        drugId:
          type: string
          format: uuid
          description: Package the reservation is placed on
        amount:
          type: number
          description: Reserved amount; may exceed what is left in the package
          example: 20.0
    MedKitCreatedDTO:
      type: object
      description: Created medicine kit
      properties:
        id:
          type: string
          format: uuid
          description: Medicine kit identifier
    InvitationDTO:
      type: object
      description: Invitation to join a medicine kit
      properties:
        key:
          type: string
          description: Key to join the kit; valid for a limited time and reusable
            within it
    DrugCreateRequest:
      type: object
      description: Request to add a drug to a medicine kit
      properties:
        name:
          type: string
          description: Drug name
          example: Aspirin
          maxLength: 300
          minLength: 1
        quantity:
          type: number
          description: "Initial stock, greater than zero"
          example: 100.0
          maximum: 9999999999999.999999
          minimum: 0.0
          multipleOf: 0.0000010
        quantityUnitId:
          type: string
          format: uuid
          description: Quantity unit identifier from the shared vocabulary
        formTypeId:
          type: string
          format: uuid
          description: Dosage form identifier from the shared vocabulary
        category:
          type: string
          description: Category
          example: painkiller
          maxLength: 200
          minLength: 0
        manufacturer:
          type: string
          description: Manufacturer
          example: Bayer
          maxLength: 300
          minLength: 0
        country:
          type: string
          description: Country
          example: Germany
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Description
          maxLength: 4000
          minLength: 0
      required:
      - name
      - quantity
      - quantityUnitId
    MembershipCreateRequest:
      type: object
      description: Request to join a medicine kit by invitation
      properties:
        key:
          type: string
          description: Invitation key
          example: sSQUCT8iOjYsobZ7StyspQ
      required:
      - key
    MedKitDTO:
      type: object
      description: Medicine kit with its drugs
      properties:
        id:
          type: string
          format: uuid
          description: Medicine kit identifier
        drugs:
          type: array
          description: Drugs stored in the kit
          items:
            $ref: "#/components/schemas/DrugDTO"
          uniqueItems: true
    IntakeRequest:
      type: object
      description: Amount taken out of the package
      properties:
        quantity:
          type: number
          description: "Amount taken, greater than zero"
          example: 2.0
          minimum: 0.0
      required:
      - quantity
    TokenResponse:
      type: object
      description: Issued access token
      properties:
        accessToken:
          type: string
          description: JWT access token
    RegisterResponse:
      type: object
      description: Registration response with generated credentials
      properties:
        login:
          type: string
          format: uuid
          description: Generated login identifier
        key:
          type: string
          description: Generated secret key for authentication
    ReservationPatchRequest:
      type: object
      description: Request to change the reserved amount
      properties:
        amount:
          type: number
          description: "New reserved amount, greater than zero"
          example: 15.0
          minimum: 0.0
      required:
      - amount
    DrugPatchRequest:
      type: object
      description: Partial update of a drug
      properties:
        name:
          type: string
          description: Drug name
          example: Aspirin
          maxLength: 300
          minLength: 1
        quantity:
          type: number
          description: "Corrected stock: you recounted the package and saw a different\
            \ number. This is a correction, not a refill — a new pack is a new package.\
            \ Reservations are left alone."
          example: 120.0
          maximum: 9999999999999.999999
          minimum: 0.0
          multipleOf: 0.0000010
        quantityUnitId:
          type: string
          format: uuid
          description: Quantity unit identifier from the shared vocabulary
        formTypeId:
          type: string
          format: uuid
          description: Dosage form identifier from the shared vocabulary
        category:
          type: string
          description: Category
          example: painkiller
          maxLength: 200
          minLength: 0
        manufacturer:
          type: string
          description: Manufacturer
          example: Bayer
          maxLength: 300
          minLength: 0
        country:
          type: string
          description: Country
          example: Germany
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Description
          maxLength: 4000
          minLength: 0
    UserSnapshotDTO:
      type: object
      description: "Everything the caller can see, in one response"
      properties:
        id:
          type: string
          format: uuid
          description: Caller identifier
        medKits:
          type: array
          description: All medicine kits available to the caller
          items:
            $ref: "#/components/schemas/MedKitDTO"
          uniqueItems: true
    VocabularyEntryDTO:
      type: object
      description: Shared vocabulary entry
      properties:
        id:
          type: string
          format: uuid
          description: Identifier
        name:
          type: string
          description: Display name
          example: mg
    MedKitSummaryDTO:
      type: object
      description: Medicine kit counters without loading its contents
      properties:
        id:
          type: string
          format: uuid
          description: Medicine kit identifier
        userCount:
          type: integer
          format: int64
          description: Number of participants
          example: 2
        drugCount:
          type: integer
          format: int64
          description: Number of drugs
          example: 17
    DrugTemplateDTO:
      type: object
      description: Catalogue entry used as a template for a new drug
      properties:
        id:
          type: string
          format: uuid
          description: Template identifier
        name:
          type: string
          description: Drug name
          example: Аспирин
        nameLat:
